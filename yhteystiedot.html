<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Yhteystiedot | Tyhmäjätkä</title>
  </head>
  <body>
    <!-- Header will be loaded here -->
    <div id="header-placeholder"></div>

    <!-- Team Section -->
    <section class="team-section">
      <div class="team-container">
        <h1 class="team-title">Tiimi</h1>
        <div class="team-cards">
          <!-- Card 1 -->
          <div class="team-card">
            <div class="team-card-image">
              <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600&h=800&fit=crop&crop=face" alt="Toimitusjohtaja">
            </div>
            <h3 class="team-card-title">Toimitusjohtaja</h3>
          </div>

          <!-- Card 2 -->
          <div class="team-card">
            <div class="team-card-image">
              <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=600&h=800&fit=crop&crop=face" alt="Tyhmäjätkä">
            </div>
            <h3 class="team-card-title">Talousjohtaja</h3>
          </div>

          <!-- Card 3 -->
          <div class="team-card">
            <div class="team-card-image">
              <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=600&h=800&fit=crop&crop=face" alt="Luova johtaja">
            </div>
            <h3 class="team-card-title">Luova johtaja</h3>
          </div>

          <!-- Card 4 -->
          <div class="team-card">
            <div class="team-card-image">
              <img src="https://images.unsplash.com/photo-1519345182560-3f2917c472ef?w=600&h=800&fit=crop&crop=face" alt="Harjoittelija">
            </div>
            <h3 class="team-card-title">Harjoittelija</h3>
          </div>
        </div>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
